name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's packaged ShellCheck lags behind; a pinned image keeps
      # results the same for everyone.
      - name: Run ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0
          src/nofixedaddress.sh tests/run.sh tests/e2e.sh

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # /bin/sh is dash here, the strictest of the shells the script supports.
      - name: Unit tests
        run: sh tests/run.sh
      - name: End-to-end tests
        run: sh tests/e2e.sh

  image:
    name: Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Catches architecture-specific breakage before a release tag does.
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nofixedaddress:ci
          build-args: VERSION=ci
          cache-from: type=gha

      - name: Unit tests under busybox ash
        run: >-
          docker run --rm --entrypoint sh -v "$PWD/tests:/tests:ro"
          -e NFA_SCRIPT=/usr/local/bin/nofixedaddress nofixedaddress:ci /tests/run.sh

      - name: End-to-end tests against the image
        run: sh tests/e2e.sh
        env:
          NFA_IMAGE: nofixedaddress:ci

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id nofixedaddress:ci -u)" = 10001
