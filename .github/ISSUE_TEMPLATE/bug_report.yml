name: Bug report
description: Something does not work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Before you paste anything,
        remove your API token and anything else you would rather keep private.
  - type: input
    id: version
    attributes:
      label: Image version
      description: The image tag or digest you run, and the version from the first log line ("No Fixed Address 1.1.0 starting").
      placeholder: ghcr.io/mdr6273/no-fixed-address:1.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Unraid
        - Docker Compose
        - docker run
        - Other (please describe below)
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      description: Running `uname -m` on the host prints it.
      options:
        - amd64 (x86_64)
        - arm64 (aarch64)
        - arm/v7 (armv7l, such as 32-bit Raspberry Pi OS)
        - arm/v6 (armv6l, such as a Raspberry Pi Zero or 1)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: The environment variables you set, with CF_API_TOKEN and NOTIFY_URL removed.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Restart the container with LOG_LEVEL=debug and paste the output from
        startup through the first check. The token is never logged, but the
        log does show your public IP address and record names. Replace them
        with placeholders if you'd rather not share them, especially if your
        records are proxied to keep that address private.
      render: text
    validations:
      required: true
