name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project aims to stay small: a shell script, curl and jq. Ideas
        that fit within that are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working, including any new settings.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you have tried?
